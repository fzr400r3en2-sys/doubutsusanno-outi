<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7e7ba">
    <meta name="description" content="どうぶつに合うおうちをタップして遊ぶ幼児向けゲーム">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="どうぶつさんのおうち">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>どうぶつさんのおうち</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css?v=5">
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="screen start-screen is-active" id="startScreen">
        <div class="start-illustration" aria-hidden="true">
          <span class="sun"></span>
          <span class="hill hill-one"></span>
          <span class="hill hill-two"></span>
          <span class="path"></span>
        </div>
        <div class="start-content">
          <p class="eyebrow">やさしく えらぶ あそび</p>
          <h1>どうぶつさんのおうち</h1>
          <button class="primary-button" id="startButton" type="button">はじめる</button>
          <button class="install-guide-button" id="installGuideButton" type="button">ホームに追加</button>
        </div>
      </section>

      <section class="screen game-screen" id="gameScreen" hidden>
        <header class="game-header">
          <p class="round-label" id="roundLabel">どうぶつさん</p>
          <p class="message" id="message">どのおうちかな？</p>
        </header>

        <section class="play-field" aria-label="どうぶつとおうち">
          <div class="animal-stage" id="animalStage">
            <div class="animal-shadow" aria-hidden="true"></div>
            <img class="animal-image" id="animalImage" src="" alt="">
            <p class="animal-name" id="animalName"></p>
          </div>

          <div class="homes-grid" id="homesGrid" aria-label="おうちをえらぶ"></div>
        </section>

        <div class="next-area" id="nextArea" hidden>
          <button class="primary-button next-button" id="nextButton" type="button">つぎのどうぶつ</button>
        </div>
      </section>

      <section class="screen end-screen" id="endScreen" hidden>
        <div class="end-animals" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <h2>みんな おうちに かえったね</h2>
        <button class="primary-button" id="againButton" type="button">もういっかい</button>
      </section>

      <section class="install-sheet" id="installSheet" role="dialog" aria-modal="true" aria-labelledby="installTitle" hidden>
        <div class="install-dialog">
          <div class="install-copy">
            <p class="install-kicker">つぎから すぐあそぶ</p>
            <h2 id="installTitle">ホームに追加</h2>
            <p class="install-lead" id="installLead"></p>
          </div>
          <ol class="install-steps" id="installSteps"></ol>
          <div class="install-actions">
            <button class="primary-button install-action-button" id="pwaInstallButton" type="button" hidden>この端末に追加</button>
            <button class="secondary-button" id="closeInstallButton" type="button">とじる</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
