<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>どうぶつさんのおうち 素材プレビュー</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        color: #4d392d;
        background: #fff9e8;
      }
      main {
        width: min(1080px, 100%);
        margin: 0 auto;
        padding: 24px;
      }
      h1 { margin: 0 0 20px; font-size: clamp(1.8rem, 5vw, 3rem); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 16px;
        border: 5px solid #4d392d;
        border-radius: 22px;
        background: white;
        text-align: center;
      }
      img {
        width: 100%;
        max-width: 170px;
        aspect-ratio: 1;
        object-fit: contain;
      }
      figcaption {
        margin-top: 10px;
        font-weight: 800;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>どうぶつさんのおうち 素材プレビュー</h1>
      <div class="grid">
      <figure><img src="animals/dog.svg" alt="いぬ"><figcaption>どうぶつ: いぬ</figcaption></figure>
      <figure><img src="animals/cat.svg" alt="ねこ"><figcaption>どうぶつ: ねこ</figcaption></figure>
      <figure><img src="animals/bird.svg" alt="とり"><figcaption>どうぶつ: とり</figcaption></figure>
      <figure><img src="animals/fish.svg" alt="さかな"><figcaption>どうぶつ: さかな</figcaption></figure>
      <figure><img src="animals/rabbit.svg" alt="うさぎ"><figcaption>どうぶつ: うさぎ</figcaption></figure>
      <figure><img src="animals/panda.svg" alt="ぱんだ"><figcaption>どうぶつ: ぱんだ</figcaption></figure>
      <figure><img src="animals/pig.svg" alt="ぶた"><figcaption>どうぶつ: ぶた</figcaption></figure>
      <figure><img src="animals/frog.svg" alt="かえる"><figcaption>どうぶつ: かえる</figcaption></figure>
      <figure><img src="animals/bear.svg" alt="くま"><figcaption>どうぶつ: くま</figcaption></figure>
      <figure><img src="animals/mouse.svg" alt="ねずみ"><figcaption>どうぶつ: ねずみ</figcaption></figure>
      <figure><img src="homes/doghouse.svg" alt="いぬごや"><figcaption>おうち: いぬごや</figcaption></figure>
      <figure><img src="homes/cushion.svg" alt="クッション"><figcaption>おうち: クッション</figcaption></figure>
      <figure><img src="homes/tree.svg" alt="き"><figcaption>おうち: き</figcaption></figure>
      <figure><img src="homes/aquarium.svg" alt="すいそう"><figcaption>おうち: すいそう</figcaption></figure>
      <figure><img src="homes/grass.svg" alt="くさむら"><figcaption>おうち: くさむら</figcaption></figure>
      <figure><img src="homes/bamboo.svg" alt="たけ"><figcaption>おうち: たけ</figcaption></figure>
      <figure><img src="homes/pigpen.svg" alt="ぶたごや"><figcaption>おうち: ぶたごや</figcaption></figure>
      <figure><img src="homes/lilypad.svg" alt="はす"><figcaption>おうち: はす</figcaption></figure>
      <figure><img src="homes/cave.svg" alt="ほらあな"><figcaption>おうち: ほらあな</figcaption></figure>
      <figure><img src="homes/hole.svg" alt="あな"><figcaption>おうち: あな</figcaption></figure>
      </div>
    </main>
  </body>
</html>
